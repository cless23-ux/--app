<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUXCO 자재 관리마스터</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .scanner-container video { object-fit: cover !important; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans">

  <!-- 헤더 -->
  <header class="bg-blue-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold tracking-wider">LUXCO</h1>
          <p class="text-[10px] text-blue-200">Upright Green Energy Partner</p>
        </div>
      </div>
      <div class="mt-3 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold flex items-center gap-1.5">
            📦 자재 관리마스터
          </h2>
          <p class="text-xs text-blue-200">선박생산부</p>
        </div>
        <button onclick="toggleScanner()" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded-lg border border-blue-400 flex items-center gap-1">
          📷 QR 스캔
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- QR 스캐너 -->
    <div id="scannerSection" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-semibold text-gray-700">QR 코드 스캔</h2>
        <button onclick="toggleScanner()" class="text-gray-400 hover:text-gray-600 text-sm">닫기</button>
      </div>
      <div id="reader" class="scanner-container overflow-hidden rounded-lg"></div>
    </div>

    <!-- 검색 섹션 -->
    <div id="searchSection" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex gap-2">
        <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') executeSearch()" placeholder="자재명 또는 코드를 입력하세요"
               class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="executeSearch()" class="bg-blue-600 text-white text-sm px-4 py-2.5 rounded-lg font-medium hover:bg-blue-700">
          검색
        </button>
      </div>

      <!-- 검색 결과 -->
      <div id="searchResults" class="divide-y divide-gray-100 max-h-60 overflow-y-auto hidden"></div>
    </div>

    <!-- 불출 등록 폼 -->
    <div id="dispatchForm" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <div class="border-b pb-3 flex justify-between items-start">
        <div>
          <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2 py-0.5 rounded" id="dispCode"></span>
          <h3 class="font-bold text-gray-900 text-base mt-1" id="dispName"></h3>
          <p class="text-xs text-gray-500" id="dispSpec"></p>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-500">현재 재고</span>
          <p class="font-bold text-blue-600 text-lg" id="dispStock"></p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">프로젝트</label>
          <select id="fProject" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">선택하세요</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">호선</label>
          <input type="text" id="fShip" list="shipList" placeholder="호선명 입력 또는 선택" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
          <datalist id="shipList"></datalist>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">불출 수량</label>
          <input type="number" id="fQty" min="1" placeholder="수량 입력" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">불출 수령자</label>
          <select id="fUser" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">선택하세요</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">비고</label>
          <input type="text" id="fNote" placeholder="비고 사항 입력 (선택)" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="backToSearch()" class="w-1/3 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg text-sm transition-colors">취소</button>
        <button id="submitBtn" onclick="submitForm()" class="w-2/3 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm shadow transition-colors">불출 등록</button>
      </div>
    </div>

    <!-- 재고 부족 자재 알림 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h3 class="text-sm font-bold text-red-600 flex items-center gap-1.5 mb-2">
        ⚠️ 재고 부족 자재 목록
      </h3>
      <div id="lowStockList" class="divide-y divide-gray-100 text-xs text-gray-600">
        <p class="py-2 text-gray-400">데이터를 불러오는 중...</p>
      </div>
    </div>

  </main>

  <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg hidden z-50"></div>

  <script>
    // ⚠️ 아래 큰따옴표 안에 본인의 Google Apps Script 배포 URL을 넣어주세요!
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz91LlNEZBaXzusgwIeEK0BN068KrlFHWEAA07RyXK4cVrul4Dm1xoHajiKxB7U1YVz/exec";

    let selectedMaterial = null;
    let html5QrCode = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
      loadLowStockPanel();
    });

    // CORS 및 GitHub Pages 환경 대응 API 통신 함수
    async function apiFetch(options) {
      try {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve, reject) => {
            let runner = google.script.run
              .withSuccessHandler(res => resolve(res))
              .withFailureHandler(err => reject(err));
            
            if (options.action === 'getInitialData') runner.getInitialData();
            else if (options.action === 'search') runner.searchMaterialsLite(options.keyword);
            else if (options.action === 'getLowStock') runner.getLowStockMaterials();
            else if (options.action === 'getMaterialByCode') runner.getMaterialByCode(options.code);
            else if (options.action === 'submitDispatch') runner.submitDispatch(options.data);
          });
        } else {
          // GitHub Pages 및 외부 브라우저 환경 실행
          if (options.method === 'POST') {
            const res = await fetch(GAS_WEBAPP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(options)
            });
            return await res.json();
          } else {
            const queryParams = new URLSearchParams(options).toString();
            const res = await fetch(`${GAS_WEBAPP_URL}?${queryParams}`);
            const responseData = await res.json();
            return (responseData && responseData.data !== undefined) ? responseData.data : responseData;
          }
        }
      } catch (err) {
        throw new Error('통신 오류: ' + err.message);
      }
    }

    async function loadInitialData() {
      try {
        const data = await apiFetch({ action: 'getInitialData' }) || {};
        const projects = Array.isArray(data.projects) ? data.projects : [];
        const users = Array.isArray(data.users) ? data.users : [];
        const ships = Array.isArray(data.ships) ? data.ships : [];

        const pSelect = document.getElementById('fProject');
        pSelect.innerHTML = '<option value="">선택하세요</option>';
        projects.forEach(p => pSelect.innerHTML += `<option value="${p}">${p}</option>`);

        const uSelect = document.getElementById('fUser');
        uSelect.innerHTML = '<option value="">선택하세요</option>';
        users.forEach(u => uSelect.innerHTML += `<option value="${u}">${u}</option>`);

        const sList = document.getElementById('shipList');
        sList.innerHTML = '';
        ships.forEach(s => sList.innerHTML += `<option value="${s}">`);
      } catch (err) {
        console.error('초기 데이터 로딩 오류:', err);
      }
    }

    async function executeSearch() {
      const keyword = document.getElementById('searchInput').value.trim();
      const resContainer = document.getElementById('searchResults');
      if (!keyword) return;

      showToast('검색 중...');
      try {
        const results = await apiFetch({ action: 'search', keyword: keyword });
        resContainer.innerHTML = '';
        
        if (!Array.isArray(results) || results.length === 0) {
          resContainer.innerHTML = '<div class="p-3 text-xs text-gray-400 text-center">검색 결과가 없습니다.</div>';
        } else {
          results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'p-3 hover:bg-blue-50 cursor-pointer transition-colors';
            div.innerHTML = `
              <div class="flex justify-between items-center">
                <span class="font-semibold text-sm text-gray-800">${item.name}</span>
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">재고: ${item.stock} ${item.unit}</span>
              </div>
              <div class="text-xs text-gray-500 mt-0.5">${item.code} | ${item.spec}</div>
            `;
            div.onclick = () => selectMaterial(item);
            resContainer.appendChild(div);
          });
        }
        resContainer.classList.remove('hidden');
      } catch (err) {
        showError(err);
      }
    }

    function selectMaterial(item) {
      selectedMaterial = item;
      document.getElementById('searchResults').classList.add('hidden');
      document.getElementById('searchInput').value = '';

      document.getElementById('dispCode').innerText = item.code;
      document.getElementById('dispName').innerText = item.name;
      document.getElementById('dispSpec').innerText = item.spec || '규격 없음';
      document.getElementById('dispStock').innerText = item.stock + ' ' + item.unit;

      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('dispatchForm').classList.remove('hidden');
      stopScanner();
    }

    async function submitForm() {
      if (!selectedMaterial) return showError({ message: '선택된 자재가 없습니다.' });

      const project = document.getElementById('fProject').value;
      const ship = document.getElementById('fShip').value.trim();
      const qty = parseInt(document.getElementById('fQty').value, 10);
      const user = document.getElementById('fUser').value;
      const note = document.getElementById('fNote').value.trim();

      if (!project) return showError({ message: '프로젝트를 선택해주세요.' });
      if (!ship) return showError({ message: '호선명을 입력해주세요.' });
      if (isNaN(qty) || qty <= 0) return showError({ message: '수량을 올바르게 입력해주세요.' });
      if (qty > selectedMaterial.stock) return showError({ message: `재고(${selectedMaterial.stock})보다 많이 불출할 수 없습니다.` });
      if (!user) return showError({ message: '수령자를 선택해주세요.' });

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      showToast('불출 등록 중...');

      const payload = {
        code: selectedMaterial.code,
        name: selectedMaterial.name,
        spec: selectedMaterial.spec || '',
        unit: selectedMaterial.unit || '',
        project: project,
        ship: ship,
        qty: qty,
        user: user,
        note: note
      };

      try {
        const res = await apiFetch({ method: 'POST', action: 'submitDispatch', data: payload });
        submitBtn.disabled = false;
        if (res && res.success) {
          showToast('불출 등록이 완료되었습니다.');
          loadLowStockPanel();
          backToSearch();
        } else {
          showError({ message: (res && res.message) || '등록에 실패했습니다.' });
        }
      } catch (err) {
        submitBtn.disabled = false;
        showError(err);
      }
    }

    function backToSearch() {
      selectedMaterial = null;
      document.getElementById('fQty').value = '';
      document.getElementById('fNote').value = '';
      document.getElementById('dispatchForm').classList.add('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
    }

    function toggleScanner() {
      const section = document.getElementById('scannerSection');
      if (section.classList.contains('hidden')) {
        section.classList.remove('hidden');
        startScanner();
      } else {
        stopScanner();
      }
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        async (decodedText) => {
          stopScanner();
          showToast('자재 조회 중...');
          try {
            const res = await apiFetch({ method: 'POST', action: 'getMaterialByCode', code: decodedText });
            if (res && res.data) selectMaterial(res.data);
            else showError({ message: '자재를 찾을 수 없습니다: ' + decodedText });
          } catch (err) { showError(err); }
        },
        () => {}
      ).catch(() => {
        showError({ message: '카메라 권한을 확인해주세요.' });
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scannerSection').classList.add('hidden');
        }).catch(() => document.getElementById('scannerSection').classList.add('hidden'));
      } else {
        document.getElementById('scannerSection').classList.add('hidden');
      }
    }

    async function loadLowStockPanel() {
      try {
        const list = await apiFetch({ action: 'getLowStock' });
        const container = document.getElementById('lowStockList');
        if (!Array.isArray(list) || list.length === 0) {
          container.innerHTML = '<p class="py-2 text-gray-400">부족한 자재가 없습니다.</p>';
          return;
        }
        container.innerHTML = list.map(item => `
          <div class="py-2 flex justify-between items-center">
            <div>
              <span class="font-medium text-gray-800">${item.name}</span>
              <span class="text-gray-400 text-xs block">${item.code}</span>
            </div>
            <div class="text-right">
              <span class="text-red-500 font-bold">${item.stock} ${item.unit}</span>
              <span class="text-gray-400 text-xs block">(최소: ${item.minStock})</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function showError(err) {
      const msg = err && err.message ? err.message : String(err);
      alert('⚠️ ' + msg);
    }
  </script>
</body>
</html>
